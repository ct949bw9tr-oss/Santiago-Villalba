name: Deploy Supabase Edge Functions

on:
  workflow_dispatch: {}
  push:
    branches: [claude/taskswift-mvp-build-ax3jhh]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-wompi-checkout --project-ref qbzzlgrpacmrvtpunwxl
          supabase functions deploy wompi-webhook --project-ref qbzzlgrpacmrvtpunwxl --no-verify-jwt
